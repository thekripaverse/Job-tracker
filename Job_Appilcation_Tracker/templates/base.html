<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job & Internship Application Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-3d.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/refine.css') }}">
</head>
<body>
    <!-- Toast notifications (aria-live) -->
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

    <!-- Header & Navigation -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Job & Internship Tracker</h1>
                    <span class="brand-tagline">Smart AI-Powered Career Platform</span>
                </div>
            </div>

            <div class="header-actions">
                <!-- 1. Add Application Button -->
                <button id="btn-open-modal" class="btn btn-primary header-action-btn" title="Add Application">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Application</span>
                </button>

                <!-- 2. Theme Toggle Button -->
                <button type="button" id="theme-toggle-btn" class="btn-icon header-icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="theme-icon-sun" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>

                <!-- 3. Logout Action -->
                <a href="{{ url_for('auth.logout') }}" id="header-logout-btn" class="btn-icon header-icon-btn" title="Log Out" aria-label="Log Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>

                <!-- 4. User Name / Profile Control -->
                {% if current_user %}
                <button type="button" id="header-user-btn" class="user-profile-btn" title="Open Profile">
                    <div class="user-avatar">
                        {% if current_user.avatar_url %}
                        <img src="{{ current_user.avatar_url }}" alt="Profile" class="avatar-img">
                        {% else %}
                        <span class="avatar-initial">{{ (current_user.username or current_user.email)[0] | upper }}</span>
                        {% endif %}
                    </div>
                    <span class="user-name">{{ current_user.username or current_user.email }}</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="user-caret-icon">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Viewport (Full Width - No Sidebar) -->
    <div class="app-main-viewport">
        <!-- Top Navigation (Gradient Menu) & Search Toolbar -->
        <section class="top-nav-bar" id="top-nav-bar">
            <div class="top-nav-container">
                <!-- Gradient Menu Primary Navigation -->
                <nav class="gradient-menu-nav" aria-label="Main Navigation" role="tablist">
                    <!-- 1. Dashboard -->
                    <button type="button" class="gradient-menu-item active" id="top-nav-dashboard" data-view="dashboard" role="tab" aria-selected="true" title="Dashboard">
                        <span class="gradient-menu-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                            </svg>
                        </span>
                        <span class="gradient-menu-label">Dashboard</span>
                    </button>

                    <!-- 2. Analytics -->
                    <button type="button" class="gradient-menu-item" id="top-nav-analytics" data-view="analytics" role="tab" aria-selected="false" title="Analytics">
                        <span class="gradient-menu-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="20" x2="18" y2="10"></line>
                                <line x1="12" y1="20" x2="12" y2="4"></line>
                                <line x1="6" y1="20" x2="6" y2="14"></line>
                            </svg>
                        </span>
                        <span class="gradient-menu-label">Analytics</span>
                    </button>

                    <!-- 3. Calendar -->
                    <button type="button" class="gradient-menu-item" id="top-nav-calendar" data-view="calendar" role="tab" aria-selected="false" title="Calendar">
                        <span class="gradient-menu-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </span>
                        <span class="gradient-menu-label">Calendar</span>
                    </button>

                    <!-- 4. Fit Score -->
                    <button type="button" class="gradient-menu-item" id="top-nav-fit-score" data-view="fit-score" role="tab" aria-selected="false" title="Fit Score">
                        <span class="gradient-menu-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="6"></circle>
                                <circle cx="12" cy="12" r="2"></circle>
                            </svg>
                        </span>
                        <span class="gradient-menu-label">Fit Score</span>
                    </button>

                    <!-- 5. Resume Versions -->
                    <button type="button" class="gradient-menu-item" id="top-nav-resume-versions" data-view="resume-versions" role="tab" aria-selected="false" title="Resume Versions">
                        <span class="gradient-menu-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                                <polyline points="2 17 12 22 22 17"></polyline>
                                <polyline points="2 12 12 17 22 12"></polyline>
                            </svg>
                        </span>
                        <span class="gradient-menu-label">Resume Versions</span>
                    </button>

                    <!-- 6. Email Intelligence -->
                    <button type="button" class="gradient-menu-item" id="top-nav-email-intelligence" data-view="email-intelligence" role="tab" aria-selected="false" title="Email Intelligence">
                        <span class="gradient-menu-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <span class="gradient-menu-label">Email Intelligence</span>
                    </button>
                </nav>

                <!-- Instant Search Filter -->
                {% if request.endpoint == 'applications.index' %}
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search applications..." autocomplete="off">
                    <button id="search-clear" class="btn-icon hidden" title="Clear search">&times;</button>
                </div>
                {% endif %}
            </div>
        </section>

        <!-- Main Content Block -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Global App Scripts -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme-3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/refine.js') }}"></script>
</body>
</html>
